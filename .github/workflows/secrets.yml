name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # A Dependabot PR gets a read-only token that gitleaks-action cannot use, so
    # its pull_request run fails while the push run on the same commit passes.
    # Skip only that event for Dependabot; the push is still scanned.
    if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
