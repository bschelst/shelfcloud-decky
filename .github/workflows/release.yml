name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package release zip
        run: |
          PLUGIN_NAME="Shelfcloud"
          TAG="${GITHUB_REF#refs/tags/}"

          mkdir -p "${PLUGIN_NAME}/dist"
          mkdir -p "${PLUGIN_NAME}/py_modules"
          mkdir -p "${PLUGIN_NAME}/bin"

          cp plugin.json package.json main.py LICENSE "${PLUGIN_NAME}/"
          cp dist/index.js "${PLUGIN_NAME}/dist/"
          cp py_modules/*.py "${PLUGIN_NAME}/py_modules/"
          cp bin/*.py "${PLUGIN_NAME}/bin/"
          chmod +x "${PLUGIN_NAME}"/bin/*.py

          zip -r "shelfcloud-decky-${TAG}.zip" "${PLUGIN_NAME}"
          cp "shelfcloud-decky-${TAG}.zip" "shelfcloud-decky.zip"

      - name: Fetch tag annotation
        run: git fetch --tags --force

      - name: Write release body
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          git tag -l --format='%(contents)' "${TAG}" > release_body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shelfcloud-decky-*.zip
            shelfcloud-decky.zip
          generate_release_notes: false
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
